name: Test Playwright Access to poe.pl.ua

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  test-playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Playwright
        run: |
          pip install playwright requests
          python -m playwright install chromium
          python -m playwright install-deps chromium
      
      - name: Check IP
        run: curl -s https://api.ipify.org?format=json | jq .
      
      - name: Run test
        run: |
          cat > test.py << 'EOF'
import logging
import sys
import time
from playwright.sync_api import sync_playwright, TimeoutError

logging.basicConfig(level=logging.INFO)
logger = logging.getLogger(__name__)

URL = "https://www.poe.pl.ua/disconnection/power-outages/"

with sync_playwright() as p:
    browser = p.chromium.launch(
        headless=True,
        args=['--disable-blink-features=AutomationControlled']
    )
    page = browser.new_page()
    
    # Try different strategies
    for strategy, timeout in [
        ('commit', 15000),
        ('domcontentloaded', 30000),
        ('load', 60000),
    ]:
        try:
            logger.info(f"Trying: {strategy} ({timeout}ms)")
            response = page.goto(URL, wait_until=strategy, timeout=timeout)
            
            if response and response.status == 200:
                logger.info(f"SUCCESS - Status {response.status}")
                sys.exit(0)
        except TimeoutError:
            logger.warning(f"Timeout")
    
    logger.error("FAILED - All strategies timed out")
    sys.exit(1)
EOF
          python test.py
