name: Test poe.pl.ua Access

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  schedule:
    - cron: '0 8 * * *'

jobs:
  test-access:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Check IP
        run: |
          echo "Current IP:"
          curl -s https://api.ipify.org?format=json | jq .
      
      - name: Install Playwright
        run: |
          pip install playwright requests
          python -m playwright install chromium
          python -m playwright install-deps chromium
      
      - name: Run test
        env:
          PROXY_AUTH_USER: ${{ secrets.PROXY_AUTH_USER }}
          PROXY_AUTH_PASS: ${{ secrets.PROXY_AUTH_PASS }}
        run: python test_playwright_access.py
      
      - name: Check result
        if: always()
        run: echo "Test completed"
