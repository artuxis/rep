name: Power Outage Monitor

on:
  schedule:
    - cron: '50 5 * * *'      # 07:50 Київ → initial
    - cron: '*/15 5-18 * * *' # 08:00–21:45 Київ → check
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    env:
      STATE_FILE: last_schedule.txt

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine mode
        id: mode
        run: |
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            if [[ "$(date -u '+%H%M')" == "0550" ]]; then
              echo "mode=initial" >> $GITHUB_OUTPUT
            else
              echo "mode=check" >> $GITHUB_OUTPUT
            fi
          else
            echo "mode=check" >> $GITHUB_OUTPUT
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install requests beautifulsoup4

      - name: Run parser
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python parser.py --mode ${{ steps.mode.outputs.mode }}

      - name: Commit state
        if: success()
        run: |
          if git diff --quiet "$STATE_FILE"; then
            echo "Без змін"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$STATE_FILE"
            git commit -m "Update schedule [skip ci]"
            git push
