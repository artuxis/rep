name: Power Outage Checker (POE.PL.UA)

on:
  schedule:
    - cron: '0 * * * *'  # Кожну годину о :00
  workflow_dispatch:     # Дозволяє запускати вручну

jobs:
  check-schedule:
    runs-on: ubuntu-latest
    env:
      # Важливо: Якщо проксі потрібен лише для доступу до зовнішнього сайту, а не для git/pip,
      # тоді краще передавати його як змінну (як ви зробили) і обробляти в Python.
      # Але для GitHub Actions стандартним є використання HTTP_PROXY/HTTPS_PROXY.
      HTTPS_PROXY: http://91.238.104.172:2024
      HTTP_PROXY: http://91.238.104.172:2024
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # --- НОВИЙ КРОК: ПЕРЕВІРКА ПРОКСІ ---
      - name: Proxy Health Check
        id: proxy_check # Додаємо ID для подальшої перевірки
        run: python proxy_health_check.py
        # Якщо цей крок провалюється, то весь Job зупиниться (за замовчуванням)

      # Основний парсер запуститься, тільки якщо Proxy Health Check пройшов
      - name: Run Power Outage Parser via Proxy
        # Запуск основного парсера
        run: python poe_parser.py
        # Видалено if: success(), оскільки це стандартна поведінка (кроки виконуються послідовно)
       
      - name: Send Telegram Notification (if message file exists)
        # Цей крок виконається лише, якщо файл message.txt буде створено вашим скриптом
        if: success() && fileExists('message.txt')
        uses: appleboy/telegram-action@master
        with:
          to: ${{ env.TELEGRAM_CHAT_ID }}
          token: ${{ env.TELEGRAM_TOKEN }}
          document: message.txt
          
      - name: Upload result as artifact
        uses: actions/upload-artifact@v4
        with:
          name: schedule-result
          path: result_*.txt
          retention-days: 7
