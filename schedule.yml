name: Power Outage Monitor (Scheduled & Monitor)

on:
  # 1. Щоденне надсилання о 07:50 за Києвом (05:50 UTC)
  schedule:
    - cron: '50 5 * * *'
    # 2. Моніторинг: кожні 15 хв з 05:00 UTC по 18:45 UTC (08:00–21:45 Київ)
    - cron: '*/15 5-18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-parser:
    # ✅ ВИПРАВЛЕННЯ #1: Використовуємо стабільніший раннер
    runs-on: ubuntu-22.04 

    env:
      STATE_FILE: last_schedule.txt

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Run Mode
        id: determine_mode
        run: |
          CURRENT_MINUTE=$(date -u +%H:%M)
          # Якщо зараз 05:50 UTC → режим initial
          if [ "$CURRENT_MINUTE" = "05:50" ]; then
            echo "mode=initial" >> $GITHUB_OUTPUT
          else
            echo "mode=check" >> $GITHUB_OUTPUT
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # ✅ ВИПРАВЛЕННЯ #2: ВИКОРИСТОВУЄМО ГОТОВУ ДІЮ ДЛЯ CHROME
      - name: Install Chrome & dependencies
        uses: browser-actions/setup-chrome@v1
        id: install-chrome # Зберігаємо вихідні дані (шляхи)

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run Python Parser
        id: run_script
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          # ✅ Передаємо шлях до драйвера, який надала попередня дія
          CHROMEDRIVER_PATH: ${{ steps.install-chrome.outputs.chromedriver-path }} 
        run: |
          echo "Running parser in mode: ${{ steps.determine_mode.outputs.mode }}"
          python parser.py --mode ${{ steps.determine_mode.outputs.mode }}

      - name: Commit and Push new state (if file changed)
        if: success()
        run: |
          if git diff --quiet $STATE_FILE; then
            echo "✅ State file unchanged, skipping commit."
          else
            echo "📝 State file changed — committing update."
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git add $STATE_FILE
            git commit -m "🤖 Update schedule state [skip ci]"
            git push
